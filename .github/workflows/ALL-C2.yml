name: ALL-C2

# Every 12 hours (03:23 and 15:23 UTC) and on demand from the Actions tab.
on:
  schedule:
    - cron: "23 3 * * *"
    - cron: "23 15 * * *"
  workflow_dispatch:

# Automatic GITHUB_TOKEN only - no user secrets required.
permissions:
  contents: write

concurrency:
  group: all-c2-update
  cancel-in-progress: false

jobs:
  test-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract + TCP-ping + real Xray test + write ALL-C2.txt
        env:
          SUB_FILE: SUB-DFF.txt
          ALL_C2_FILE: ALL-C2.txt
          # Raw address of ALL-C2.txt itself - always re-extracted so healthy
          # proxies from previous rounds are re-tested every run.
          ALL_C2_SELF_URL: https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/${{ github.ref_name }}/ALL-C2.txt
          MAX_XRAY_TEST: "2000"
          BATCH_SIZE: "250"
          XRAY_WORKERS: "32"
          JOB_BUDGET_MIN: "55"
        run: python scripts/all_c2_manager.py

      - name: Commit and push (only if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ALL-C2.txt
          if git diff --cached --quiet; then
            echo "ALL-C2.txt unchanged - nothing to commit."
          else
            git commit -m "chore: refresh ALL-C2.txt (xray live-tested proxies)"
            git push
          fi
