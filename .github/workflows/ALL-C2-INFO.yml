name: ALL-C2-INFO

# Every 8 hours (01:37, 09:37, 17:37 UTC) and on demand from the Actions tab.
on:
  schedule:
    - cron: "37 1 * * *"
    - cron: "37 9 * * *"
    - cron: "37 17 * * *"
  workflow_dispatch:

# Automatic GITHUB_TOKEN only - no user secrets required.
permissions:
  contents: write

concurrency:
  group: all-c2-info
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load every proxy through Xray + browserleaks + classify
        env:
          # Raw address of ALL-C2.txt - the proxy list to classify
          ALL_C2_URL: https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/${{ github.ref_name }}/ALL-C2.txt
          PAGE_URL: https://browserleaks.com/ip
          INFO_WORKERS: "24"
          BATCH_SIZE: "100"
          PAGE_MAX_TIME: "30"
          JOB_BUDGET_MIN: "35"
        run: python scripts/all_c2_info_manager.py

      - name: Commit and push folders (only if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add country isp non-cloudflare 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "folders unchanged - nothing to commit."
          else
            git commit -m "chore: classify ALL-C2 proxies by country/isp (browserleaks)"
            git pull --rebase --quiet origin "$GITHUB_REF_NAME" || true
            git push
          fi
