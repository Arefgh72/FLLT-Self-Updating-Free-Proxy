name: FLLT-test

# Runs every 24 hours (UTC) and on demand from the Actions tab.
on:
  schedule:
    - cron: "23 6 * * *" # once a day; GitHub may start scheduled runs a few minutes late
  workflow_dispatch:

# Needed so the final step can push the updated SUB-DFF back to the repo.
# Uses the automatic GITHUB_TOKEN only - no user secrets required.
permissions:
  contents: write

concurrency:
  group: sub-dff-update
  cancel-in-progress: false

jobs:
  update-sub-dff:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate + collect + merge SUB-DFF
        env:
          # Automatic token of this workflow (not a user key); only raises the
          # GitHub search-API rate limit. The script also works without it.
          GH_TOKEN: ${{ github.token }}
          SUB_FILE: SUB-DFF.txt
          MIN_PROXIES: "2"
          MIN_DISCOVERED: "10"
          MAX_DISCOVERED: "40"
        run: python scripts/sub_dff_manager.py

      - name: Commit and push (only if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SUB-DFF.txt
          if git diff --cached --quiet; then
            echo "SUB-DFF.txt unchanged - nothing to commit."
          else
            git commit -m "chore: refresh SUB-DFF.txt (validate + collect + merge)"
            git push
          fi
